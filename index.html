<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Academia De Heróis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Academia De Heróis</h1>
    <p><small>Inscreva-se para participar da próxima missão.</small></p>
      </header>
      <main>
        <section>
          <h2>Faça sua inscrição</h2>
        </section>
<form action="#" method="get">
    <label for="Nome do Heroi">Nome do Heroi:</label>
    <input type="text" name="Nome Do Heroi" id="Nome do Heroi" required>
    <br><br>
    <label for="E-mail">E-mail:</label>
    <input type="text" name="E-mail" id="E-mail" required>
    <br><br>
    <label for="Idade">Idade:</label>
    <input type="number" name="Idade" id="Idade" required>
    <br><br>
    <input type="submit" value="Cadastrar">
   

    <label for="equipe">Escolha sua equipe:</label>
                <select id="equipe" name="equipe">
                    <option>Avengers</option>
                    <br>
                    <option>Bestas Enjauladas</option>
                    <br>
                    <option>Liga da Justiça</option>
                    <br>
                </select>
                <h2>Qual poder você prefere?</h2>
                <br>
                <section id="prefere1">
                   
                        <input type="radio" name="poder" id="voar" value="voar">
                        <label for="voar">Voar</label>
                    
                    
                    <section id="prefere2">  
                    <input type="radio" name="poder" id="supervelocidade" value="superforca">
                    <label for="supervelocidade">Super Velocidade</label>
                    </section>


                    <section id="prefere3">
                        <input type="radio" name="poder" id="superforca" value="superforca">
                        <label for="superforca">Super Força</label>
                    </section>
                    
                    <section id="prefere4">
                        <input id="missoes" name="missoes" type="checkbox" value="missoes">
                        <label for="missoes">Quero receber novas missões</label>
                    </section>


                    </section>
                    <label for="motivo">Por que você quer ser um herói?</label>
                    <textarea id="motivo" name="motivo" rows="4" cols="50"></textarea>
                </section>
                <button type="submit">Enviar Inscrição</button>
            </form>
            </main>
            <footer>
                <p>Prática de Formulários HTML.</p>
            </footer>
    </body>
</html>
